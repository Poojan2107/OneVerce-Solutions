<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Signal Lost | Oneverce Solutions</title>
    <meta name="robots" content="noindex" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #050505;
        color: #f4f4f5;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .container {
        max-width: 600px;
      }
      .code {
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1;
        background: linear-gradient(135deg, #00f0ff, #9333ea);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5em;
        color: #71717a;
        margin: 1.5rem 0 1rem;
      }
      .message {
        font-size: 1.125rem;
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 2.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.875rem 2.5rem;
        background: #fff;
        color: #050505;
        text-decoration: none;
        font-size: 0.625rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        border-radius: 9999px;
        transition:
          transform 0.3s,
          background 0.3s;
      }
      .btn:hover {
        transform: scale(1.05);
        background: #00f0f0;
      }
      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        pointer-events: none;
        z-index: -1;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="grid"></div>
    <div class="container">
      <div class="code">404</div>
      <div class="label">Signal Lost</div>
      <p class="message">
        This node doesn't exist in our architecture. The frequency you're looking for has gone dark.
      </p>
      <a href="/" class="btn">Return to Base</a>
    </div>
  </body>
</html>
